name: Kissan Mithar — Microservices CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target AWS Lambda environment
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

concurrency:
  group: kissan-mithar-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-2
  SAM_CLI_TELEMETRY: "0"

jobs:
  # ============================================================================
  # 1. CI — Build & Unit Test Every Domain Microservice Independently
  # ============================================================================
  test-domain-services:
    name: Service CI (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - media-service
          - notification-service
          - field-service
          - marketplace-service
          - agricultural-ai-service
          - identity-service
          - analytics-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install, build, and test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: |
          npm install
          npm run build
          npm test

  # ============================================================================
  # 2. CI — API Gateway End-to-End Integration Suite (All 7 Peer Services)
  # ============================================================================
  test-api-gateway:
    name: API Gateway E2E CI
    runs-on: ubuntu-latest
    needs: test-domain-services
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies across services
        run: |
          for svc in services/*; do
            echo "Installing $svc..."
            (cd "$svc" && npm install)
          done

      - name: Build and run Gateway integration suite
        working-directory: services/api-gateway
        run: |
          npm run build
          npm test

  # ============================================================================
  # 3. CI — KM 360 Python FastAPI ML Inference Suite
  # ============================================================================
  test-km360-ml:
    name: KM 360 ML CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: KM_360/requirements.txt

      - name: Install Python dependencies & run ML tests
        working-directory: KM_360
        run: |
          pip install -r requirements.txt pytest httpx
          python test_ml_service.py
          pytest tests/

  # ============================================================================
  # 4. CI — React Web Portal & Admin Dashboard Build
  # ============================================================================
  test-web:
    name: Web Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build web frontend
        working-directory: web
        run: |
          npm ci
          npm run build

  # ============================================================================
  # 5. CI — Flutter Mobile App Verification
  # ============================================================================
  test-flutter:
    name: Flutter Mobile CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze & test Flutter app
        working-directory: kissan_mithar_app
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze --no-fatal-infos
          flutter test

  # ============================================================================
  # 6. CI — Validate Container & SAM Infrastructure Specs
  # ============================================================================
  validate-infra:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose platform topology
        run: docker compose -f docker-compose.platform.yml config --quiet

      - uses: aws-actions/setup-sam@v2

      - name: Validate AWS SAM 9-microservice template
        run: sam validate -t template.yaml --region ${{ env.AWS_REGION }}

  # ============================================================================
  # 7. CD — Deploy All 9 Microservices to AWS Lambda (ap-southeast-2)
  # ============================================================================
  deploy-aws-lambda:
    name: CD — Deploy 9 Microservices to AWS Lambda
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs:
      - test-api-gateway
      - test-km360-ml
      - test-web
      - validate-infra
    steps:
      - uses: actions/checkout@v4

      - name: Check AWS deployment secrets
        id: creds
        env:
          HAS_AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: echo "ready=${HAS_AWS_KEY}" >> "$GITHUB_OUTPUT"

      - name: Skip deployment notice when secrets are not yet configured
        if: steps.creds.outputs.ready != 'true'
        run: |
          echo "AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY GitHub Secrets are not set yet. Configure secrets from docs/CI_CD_PIPELINE.md to enable automated AWS Lambda deployment."

      - uses: docker/setup-qemu-action@v3
        if: steps.creds.outputs.ready == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.ready == 'true'

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2
        if: steps.creds.outputs.ready == 'true'

      - name: Build 9 ARM64 Lambda container images
        if: steps.creds.outputs.ready == 'true'
        run: sam build --parallel -t template.yaml

      - name: Deploy SAM stack (kissan-mithar-backend)
        if: steps.creds.outputs.ready == 'true'
        env:
          TARGET_ENV: ${{ github.event.inputs.environment || 'production' }}
        run: |
          sam deploy \
            --stack-name kissan-mithar-backend \
            --region ${{ env.AWS_REGION }} \
            --resolve-s3 \
            --resolve-image-repos \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$TARGET_ENV" \
              DatabaseUrl="${{ secrets.DATABASE_URL }}" \
              DirectUrl="${{ secrets.DIRECT_URL }}" \
              JwtSecret="${{ secrets.JWT_SECRET }}" \
              InternalServiceSecret="${{ secrets.INTERNAL_SERVICE_SECRET }}" \
              GeminiApiKey="${{ secrets.GEMINI_API_KEY }}" \
              CloudinaryCloudName="${{ secrets.CLOUDINARY_CLOUD_NAME }}" \
              CloudinaryApiKey="${{ secrets.CLOUDINARY_API_KEY }}" \
              CloudinaryApiSecret="${{ secrets.CLOUDINARY_API_SECRET }}" \
              FirebaseProjectId="${{ secrets.FIREBASE_PROJECT_ID }}" \
              FirebaseClientEmail="${{ secrets.FIREBASE_CLIENT_EMAIL }}" \
              FirebasePrivateKey="${{ secrets.FIREBASE_PRIVATE_KEY }}" \
              WeatherApiKey="${{ secrets.WEATHER_API_KEY }}" \
              SmsApiKey="${{ secrets.SMS_API_KEY }}"

      - name: Post-Deploy Gateway Health Probe
        if: steps.creds.outputs.ready == 'true'
        run: |
          GW_URL=$(aws cloudformation describe-stacks \
            --stack-name kissan-mithar-backend \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiGatewayUrl'].OutputValue" \
            --output text)
          echo "Gateway URL: $GW_URL"
          curl --fail --retry 5 --retry-delay 5 "${GW_URL}/health"

  # ============================================================================
  # 8. CD — Optional React Frontend Deployment to Vercel (when token enabled)
  # ============================================================================
  deploy-web-vercel:
    name: CD — Deploy Web Portal to Vercel
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.ENABLE_VERCEL_CD == 'true'
    needs:
      - test-web
      - deploy-aws-lambda
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy web/ to Vercel Production
        working-directory: web
        run: |
          npx vercel --yes --prod --token="${{ secrets.VERCEL_TOKEN }}"
