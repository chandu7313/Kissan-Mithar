# ==============================================================================
# Docker Compose for Kissan Mithar Backend (AWS EC2 / Server Deployment)
# ==============================================================================
# Usage on EC2:
#   docker compose up -d --build
#
# Check logs:
#   docker compose logs -f backend
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.ec2
    container_name: kissan-mithar-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=4000
    volumes:
      - kissan_uploads:/app/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  kissan_uploads:
    name: kissan_mithar_uploads

